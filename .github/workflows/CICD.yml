name: Deploy InBrows

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        env:
          GOOGLE_SERVICE_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_PRIVATE_KEY }}
        run: |
          echo "NEXT_PUBLIC_SPREADSHEET_ID=${{ secrets.NEXT_PUBLIC_SPREADSHEET_ID }}" >> .env
          echo "NEXT_PUBLIC_SHEET_ID=${{ secrets.NEXT_PUBLIC_SHEET_ID }}" >> .env
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_EMAIL=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_EMAIL }}" >> .env
          echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}" >> .env
          printf "GOOGLE_SERVICE_PRIVATE_KEY=%s\n" "$GOOGLE_SERVICE_PRIVATE_KEY" >> .env
          echo "ENVIRONMENT_VAR=production" >> .env

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: aptashynskyi/in-brows:latest

  deploy:
    name: Deploy on server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull latest image
        run: docker pull aptashynskyi/in-brows:latest

      - name: Stop and remove old container
        run: docker rm -f in-brows-app-container || true

      - name: Start new container
        run: |
          docker run -d \
            --name in-brows-app-container \
            --restart unless-stopped \
            -p 3000:3000 \
            aptashynskyi/in-brows:latest

      - name: Clean up unused images
        run: docker image prune -f
