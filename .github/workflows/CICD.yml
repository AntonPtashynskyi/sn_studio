name: Deploy InBrows

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: git -C /var/www/inbrows pull origin master

      - name: Install dependencies
        run: npm ci --prefix /var/www/inbrows

      - name: Build
        run: npm run build --prefix /var/www/inbrows

      - name: Restart PM2
        run: pm2 restart inbrows
